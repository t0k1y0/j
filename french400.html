const CATEGORIES = [...new Set(DATA.map(d=>d.cat))];
const PER_PAGE = 25;
let currentSearch="", currentCat="All", currentPage=1, filtered=[...DATA];

function speak(btn, text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  document.querySelectorAll(".speak-btn.speaking").forEach(b=>b.classList.remove("speaking"));
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = "fr-FR";
  utt.rate = 0.82;
  utt.pitch = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const frVoice = voices.find(v=>v.lang==="fr-FR") || voices.find(v=>v.lang.startsWith("fr"));
  if (frVoice) utt.voice = frVoice;
  btn.classList.add("speaking");
  utt.onend = ()=>btn.classList.remove("speaking");
  utt.onerror = ()=>btn.classList.remove("speaking");
  window.speechSynthesis.speak(utt);
}

window.speechSynthesis.onvoiceschanged = ()=>window.speechSynthesis.getVoices();

function buildCats() {
  const wrap = document.getElementById("cats");
  const allBtn = document.createElement("button");
  allBtn.className="cat-btn active";
  allBtn.textContent=`Tout (${DATA.length})`;
  allBtn.onclick=()=>setCat("All");
  wrap.appendChild(allBtn);
  CATEGORIES.forEach(c=>{
    const count=DATA.filter(d=>d.cat===c).length;
    const btn=document.createElement("button");
    btn.className="cat-btn"; btn.textContent=`${c} (${count})`; btn.dataset.cat=c;
    btn.onclick=()=>setCat(c);
    wrap.appendChild(btn);
  });
}

function setCat(c) {
  currentCat=c; currentPage=1;
  document.querySelectorAll(".cat-btn").forEach(b=>{
    b.classList.toggle("active",(b.dataset.cat||"All")===c);
  });
  render();
}

function handleSearch(v){currentSearch=v;currentPage=1;render();}

function getFiltered(){
  const q=currentSearch.toLowerCase();
  return DATA.filter(w=>{
    const mc=currentCat==="All"||w.cat===currentCat;
    const mq=!q||w.fr.toLowerCase().includes(q)||w.en.toLowerCase().includes(q)||
      w.ex.toLowerCase().includes(q)||w.cat.toLowerCase().includes(q);
    return mc&&mq;
  });
}

function highlight(text, q) {
  if (!q) return text;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<em>$1</em>');
}

function render(){
  filtered=getFiltered();
  const total=filtered.length;
  const totalPages=Math.max(1,Math.ceil(total/PER_PAGE));
  if(currentPage>totalPages) currentPage=1;
  const start=(currentPage-1)*PER_PAGE;
  const visible=filtered.slice(start,start+PER_PAGE);
  const q=currentSearch.toLowerCase();

  document.getElementById("results-info").textContent=
    `${total} résultats · affichage ${total===0?0:start+1}–${Math.min(start+PER_PAGE,total)}`;

  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";
  visible.forEach(w=>{
    const c=CAT_COLORS[w.cat]||"#ccc";
    const tr=document.createElement("tr");
    const safeText=w.fr.replace(/'/g,"\\'");
    tr.innerHTML=`
      <td class="num">${w.id}</td>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="word">${highlight(w.fr,q)}</div>
          <button class="speak-btn" onclick="speak(this,'${safeText}')">🔊</button>
        </div>
        <div class="pos">${w.pos}</div>
      </td>
      <td class="english">${highlight(w.en,q)}</td>
      <td><div class="example">${highlight(w.ex,q)}</div></td>
      <td><button class="speak-btn" onclick="speak(this,'${w.ex.replace(/'/g,"\\'")}')">🔊</button></td>
      <td><span class="badge" style="background:${c}18;color:${c};border:1px solid ${c}40">${w.cat}</span></td>`;
    tbody.appendChild(tr);
  });

  const pg=document.getElementById("pagination");
  pg.innerHTML="";
  if(totalPages<=1) return;
  const prev=document.createElement("button");
  prev.className="pg-btn"; prev.textContent="← Préc."; prev.disabled=currentPage===1;
  prev.onclick=()=>{currentPage--;render();};
  pg.appendChild(prev);
  for(let p=1;p<=totalPages;p++){
    const btn=document.createElement("button");
    btn.className="pg-btn"+(p===currentPage?" active":"");
    btn.textContent=p;
    btn.onclick=(()=>{const pp=p;return()=>{currentPage=pp;render();};})();
    pg.appendChild(btn);
  }
  const next=document.createElement("button");
  next.className="pg-btn"; next.textContent="Suiv. →"; next.disabled=currentPage===totalPages;
  next.onclick=()=>{currentPage++;render();};
  pg.appendChild(next);
}

buildCats();
render();
</script>
