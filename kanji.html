const CATEGORIES = [...new Set(DATA.map(d=>d.cat))];
const PER_PAGE = 50;
let currentSearch = "", currentCat = "All", currentPage = 1;
let filtered = [...DATA];

function buildCats() {
  const wrap = document.getElementById("cats");
  const allBtn = document.createElement("button");
  allBtn.className = "cat-btn active";
  allBtn.textContent = `All (${DATA.length})`;
  allBtn.onclick = () => setCat("All");
  wrap.appendChild(allBtn);
  CATEGORIES.forEach(c => {
    const count = DATA.filter(d=>d.cat===c).length;
    const btn = document.createElement("button");
    btn.className = "cat-btn";
    btn.textContent = `${c} (${count})`;
    btn.dataset.cat = c;
    btn.onclick = () => setCat(c);
    wrap.appendChild(btn);
  });
}

function setCat(c) {
  currentCat = c; currentPage = 1;
  document.querySelectorAll(".cat-btn").forEach(b => {
    b.classList.toggle("active", (b.dataset.cat||"All") === c);
  });
  render();
}

function handleSearch(v) {
  currentSearch = v; currentPage = 1; render();
}

function getFiltered() {
  const q = currentSearch.toLowerCase();
  return DATA.filter(w => {
    const mc = currentCat === "All" || w.cat === currentCat;
    const mq = !q || w.kanji.includes(currentSearch) || w.hira.includes(q) ||
      w.roma.toLowerCase().includes(q) || w.zh.includes(currentSearch);
    return mc && mq;
  });
}

function render() {
  filtered = getFiltered();
  const total = filtered.length;
  const totalPages = Math.ceil(total / PER_PAGE);
  if (currentPage > totalPages) currentPage = 1;
  const start = (currentPage-1)*PER_PAGE;
  const visible = filtered.slice(start, start+PER_PAGE);

  document.getElementById("results-info").textContent =
    `${total} results · showing ${total===0?0:start+1}–${Math.min(start+PER_PAGE,total)}`;

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  visible.forEach(w => {
    const c = CAT_COLORS[w.cat]||"#ccc";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="num">${w.id}</td>
      <td class="kanji">${w.kanji}</td>
      <td class="hira">${w.hira}</td>
      <td class="roma">${w.roma}</td>
      <td class="zh">${w.zh}</td>
      <td><span class="badge" style="background:${c}22;color:${c};border:1px solid ${c}44">${w.cat}</span></td>
      <td><button class="speak-btn" onclick="speak(this,'${w.kanji.replace(/'/g,"\\'")}')">🔊</button></td>`;
    tbody.appendChild(tr);
  });

  const pg = document.getElementById("pagination");
  pg.innerHTML = "";
  if (totalPages <= 1) return;

  const prev = document.createElement("button");
  prev.className = "pg-btn"; prev.textContent = "← Prev";
  prev.disabled = currentPage===1;
  prev.onclick = () => { currentPage--; render(); };
  pg.appendChild(prev);

  for (let p=1; p<=totalPages; p++) {
    const btn = document.createElement("button");
    btn.className = "pg-btn" + (p===currentPage?" active":"");
    btn.textContent = p;
    btn.onclick = (()=>{ const pp=p; return ()=>{ currentPage=pp; render(); }; })();
    pg.appendChild(btn);
  }

  const next = document.createElement("button");
  next.className = "pg-btn"; next.textContent = "Next →";
  next.disabled = currentPage===totalPages;
  next.onclick = () => { currentPage++; render(); };
  pg.appendChild(next);
}

function speak(btn, text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  document.querySelectorAll(".speak-btn.speaking").forEach(b => b.classList.remove("speaking"));
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = "ja-JP";
  utt.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const jpVoice = voices.find(v => v.lang.startsWith("ja"));
  if (jpVoice) utt.voice = jpVoice;
  btn.classList.add("speaking");
  utt.onend = () => btn.classList.remove("speaking");
  utt.onerror = () => btn.classList.remove("speaking");
  window.speechSynthesis.speak(utt);
}

// Preload voices
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

buildCats();
render();
</script>
