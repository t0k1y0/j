<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innovations of the Past 20 Years</title>
<style>
:root{--ink:#1d1d1b;--muted:#6b6a65;--line:#e6e4de;--bg:#fbfaf7;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:1040px;margin:0 auto;padding:48px 24px 64px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:40px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.circ{display:inline-block;overflow:hidden;width:1.24em;height:1.24em;border:1px solid currentColor;border-radius:50%;font-size:.34em;line-height:1.02em;text-align:center;box-sizing:border-box;vertical-align:baseline;margin:0;font-weight:400;font-style:normal;letter-spacing:0}
.sub{color:var(--muted);margin:0 0 28px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.bar input{flex:1 1 220px;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{color:var(--muted);font-size:13px;margin-left:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:#f4f2ed;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:11px 14px;vertical-align:top;border-bottom:1px solid var(--line)}
tr.first td{border-top:2px solid #d8d5cc}
tr:first-child td{border-top:none}
td.y{font-weight:700;font-variant-numeric:tabular-nums;width:64px}
td.t{font-weight:600;width:30%}
td.n{color:#3b3a36}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag[data-f="AI"]{background:#dbe8fb;color:#1f4f99}
.tag[data-f="Computing"]{background:#d6f0ee;color:#16605a}
.tag[data-f="Biology"]{background:#dcf2dc;color:#2b6a2b}
.tag[data-f="Medicine"]{background:#f9dede;color:#9a2b2b}
.tag[data-f="Physics"]{background:#e7e1fb;color:#4d3a99}
.tag[data-f="Space"]{background:#f6dcef;color:#8a2a72}
.tag[data-f="Energy"]{background:#fbe5d6;color:#8f4a1a}
.tag[data-f="Finance"]{background:#f8ecc8;color:#7a5a0c}
.tag[data-f="Transportation"]{background:#e4e4e1;color:#4a4a46}
.tag[data-f="Human origins"]{background:#efeeea;color:#5c5a54}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media (max-width:700px){
 h1{font-size:30px}
 thead{display:none}
 table,tbody,tr,td{display:block;width:100%}
 td{border:none;padding:2px 14px}
 tr{padding:10px 0;border-bottom:1px solid var(--line)}
 td.y:empty{display:none}
 td.t{width:auto}
}
@media print{.bar{display:none} body{background:#fff} th{position:static}}
</style>
</head>
<body>
<main>
<h1><span class="circ" aria-hidden="true">y</span>Innovations of the Past 20 Years</h1>
<p class="sub">45 breakthroughs in science, technology, medicine and finance, 2006–2026.</p>
<div class="bar">
 <input id="q" type="search" placeholder="Search innovations or notes…" aria-label="Search">
 <span id="chips"></span>
 <span class="count" id="count"></span>
</div>
<table>
 <thead><tr><th>Year</th><th>Innovation</th><th>Field</th><th>Note</th></tr></thead>
 <tbody id="tb"></tbody>
</table>
</main>
<script>
const DATA=[{"y": 2006, "t": "Induced pluripotent stem cells (iPSCs)", "f": "Biology", "n": "Yamanaka turned adult mouse cells back into stem cells with just four genes; human iPSCs followed in 2007. Nobel Prize 2012."}, {"y": 2006, "t": "CUDA", "f": "Computing", "n": "Nvidia made GPUs programmable for general computing. It became the hardware foundation for training neural networks."}, {"y": 2006, "t": "Hinton's deep-learning paper in Science", "f": "AI", "n": "Hinton and Salakhutdinov showed deep networks could be trained layer by layer, reviving neural-network research."}, {"y": 2006, "t": "Amazon Web Services (S3, EC2)", "f": "Computing", "n": "Rentable cloud storage and servers on demand; startups no longer needed their own data centers."}, {"y": 2006, "t": "HPV vaccine (Gardasil)", "f": "Medicine", "n": "Prevents the virus behind most cervical cancers; vaccinated generations show steep drops in the disease."}, {"y": 2007, "t": "iPhone", "f": "Computing", "n": "Touchscreen phone with a full web browser; defined the modern smartphone and mobile internet."}, {"y": 2008, "t": "Bitcoin and blockchain", "f": "Finance", "n": "Satoshi Nakamoto's white paper (Oct 2008) described money on a shared, tamper-proof ledger; the network went live Jan 2009."}, {"y": 2008, "t": "U.S. shale boom", "f": "Energy", "n": "Horizontal drilling plus hydraulic fracturing made the U.S. the world's largest oil and gas producer."}, {"y": 2008, "t": "App Store and Android", "f": "Computing", "n": "Opened phones to third-party software and created the app economy."}, {"y": 2008, "t": "Denisovans", "f": "Human origins", "n": "A finger bone from Denisova Cave, Siberia; its DNA (2010) revealed an unknown archaic human group whose genes survive in living people."}, {"y": 2009, "t": "Waymo (Google self-driving car project)", "f": "Transportation", "n": "Started inside Google; launched the first fully driverless public robotaxi service, in Phoenix, in 2020."}, {"y": 2010, "t": "DeepMind", "f": "AI", "n": "Founded in London by Hassabis, Legg and Suleyman; bought by Google in 2014. Later built AlphaGo and AlphaFold."}, {"y": 2011, "t": "First checkpoint inhibitor (Yervoy)", "f": "Medicine", "n": "First drug to release the immune system's brakes against cancer (melanoma). Basis of the 2018 Nobel to Allison and Honjo."}, {"y": 2012, "t": "CRISPR-Cas9 gene editing", "f": "Biology", "n": "Doudna and Charpentier showed Cas9 can be programmed to cut any chosen DNA sequence. Nobel Prize 2020."}, {"y": 2012, "t": "AlexNet", "f": "AI", "n": "A GPU-trained neural network won the ImageNet contest by a wide margin, starting the deep-learning era."}, {"y": 2012, "t": "Higgs boson discovered", "f": "Physics", "n": "Found at CERN's Large Hadron Collider, completing the Standard Model. Nobel 2013 to Higgs and Englert."}, {"y": 2013, "t": "Sovaldi (sofosbuvir)", "f": "Medicine", "n": "Pill-based regimens built on it cure over 90% of hepatitis C infections."}, {"y": 2014, "t": "Tether (USDT)", "f": "Finance", "n": "First major dollar-pegged stablecoin; became the most traded crypto asset."}, {"y": 2014, "t": "Keytruda", "f": "Medicine", "n": "PD-1 checkpoint inhibitor approved for melanoma, then many cancers; became the world's best-selling drug."}, {"y": 2015, "t": "Ethereum", "f": "Finance", "n": "Buterin's blockchain runs programmable smart contracts, the base for DeFi, NFTs and most stablecoins."}, {"y": 2015, "t": "Reusable orbital rocket (Falcon 9 landing)", "f": "Space", "n": "First booster landing after an orbital launch (Dec 2015); reuse sharply cut the cost of reaching orbit."}, {"y": 2015, "t": "Gravitational waves detected", "f": "Physics", "n": "LIGO caught two black holes merging (announced 2016), confirming Einstein's prediction. Nobel 2017."}, {"y": 2016, "t": "AlphaGo beats Lee Sedol", "f": "AI", "n": "DeepMind's system won 4–1 at Go, a game long thought decades away for computers."}, {"y": 2017, "t": "Transformer (\"Attention Is All You Need\")", "f": "AI", "n": "Google paper introducing the architecture behind GPT, Claude, Gemini and nearly all modern AI models."}, {"y": 2017, "t": "Ozempic (semaglutide)", "f": "Medicine", "n": "Approved for type 2 diabetes; as Wegovy (2021) for obesity. Launched the GLP-1 weight-loss era."}, {"y": 2017, "t": "First CAR-T therapy (Kymriah)", "f": "Medicine", "n": "Patients' own T cells are engineered to hunt leukemia; a living drug, often curative where nothing else worked."}, {"y": 2017, "t": "Luxturna", "f": "Medicine", "n": "First U.S.-approved gene therapy for an inherited disease (a form of retinal blindness)."}, {"y": 2017, "t": "Tesla Model 3", "f": "Transportation", "n": "First mass-market long-range electric car; made EVs mainstream."}, {"y": 2017, "t": "Binance", "f": "Finance", "n": "Founded by Changpeng Zhao; within months the largest crypto exchange by volume."}, {"y": 2018, "t": "AlphaFold", "f": "AI", "n": "Won the CASP13 protein-structure contest; AlphaFold 2 (2020) predicts structures near lab accuracy. Nobel Chemistry 2024."}, {"y": 2019, "t": "First image of a black hole", "f": "Space", "n": "The Event Horizon Telescope linked radio dishes worldwide to image the black hole in galaxy M87."}, {"y": 2020, "t": "mRNA COVID-19 vaccines", "f": "Medicine", "n": "Pfizer-BioNTech and Moderna vaccines authorized within a year of the virus's sequence. Nobel 2023 to Karikó and Weissman."}, {"y": 2021, "t": "James Webb Space Telescope", "f": "Space", "n": "Launched Dec 25, 2021; infrared views of the earliest galaxies and of exoplanet atmospheres."}, {"y": 2022, "t": "ChatGPT", "f": "AI", "n": "OpenAI's chatbot launched Nov 30, 2022 and reached about 100 million users in two months, the fastest-growing app to then."}, {"y": 2022, "t": "Nobel for ancient human DNA (Pääbo)", "f": "Human origins", "n": "Svante Pääbo honored for sequencing the Neanderthal genome and discovering the Denisovans."}, {"y": 2022, "t": "Fusion ignition (NIF)", "f": "Energy", "n": "Lawrence Livermore's lasers produced more fusion energy (3.15 MJ) than they delivered to the fuel (2.05 MJ), Dec 5, 2022."}, {"y": 2023, "t": "Casgevy, first CRISPR therapy", "f": "Medicine", "n": "Approved in the UK (Nov) and U.S. (Dec) for sickle-cell disease and beta thalassemia."}, {"y": 2024, "t": "Neuralink first human implant", "f": "Medicine", "n": "A paralyzed patient controlled a computer cursor by thought alone."}, {"y": 2024, "t": "Nobel Prizes for AI", "f": "AI", "n": "Physics to Hopfield and Hinton for neural networks; Chemistry to Hassabis and Jumper (AlphaFold) with Baker (protein design)."}, {"y": 2024, "t": "Reasoning models (OpenAI o1)", "f": "AI", "n": "Models trained to think step by step before answering; large gains in math, science and coding."}, {"y": 2025, "t": "DeepSeek-R1", "f": "AI", "n": "Chinese open-weight reasoning model rivaling top U.S. models at a reported fraction of the cost; Nvidia lost nearly $600B in value in one day."}, {"y": 2025, "t": "Starship", "f": "Space", "n": "Fully reusable super-heavy rocket. First flight Apr 2023, booster caught by the tower Oct 2024, test campaign through 2025."}, {"y": 2025, "t": "First personalized CRISPR therapy", "f": "Medicine", "n": "A custom base-editing treatment built in about six months for infant KJ Muldoon, born with a rare liver disorder (CHOP/Penn)."}, {"y": 2025, "t": "Lenacapavir (Yeztugo)", "f": "Medicine", "n": "FDA-approved twice-yearly injection that prevents HIV infection."}, {"y": 2026, "t": "Trump accounts", "f": "Finance", "n": "Children's investment accounts launched July 4, with $1,000 from Treasury for babies born 2025–2028. Musk pledged ~$10B in SpaceX stock."}];
const FIELDS=["AI", "Computing", "Biology", "Medicine", "Physics", "Space", "Energy", "Finance", "Transportation", "Human origins"];
let active=new Set();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chips=document.getElementById('chips');
FIELDS.forEach(f=>{const b=document.createElement('button');b.className='chip';b.textContent=f;
 b.onclick=()=>{active.has(f)?active.delete(f):active.add(f);b.classList.toggle('on');render();};chips.appendChild(b);});
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const rows=DATA.filter(r=>(!active.size||active.has(r.f))&&(!q||(r.t+' '+r.n+' '+r.f+' '+r.y).toLowerCase().includes(q)));
 let prev=null,h='';
 rows.forEach(r=>{const first=r.y!==prev;prev=r.y;
  h+=`<tr class="${first?'first':''}"><td class="y">${first?r.y:''}</td><td class="t">${esc(r.t)}</td><td><span class="tag" data-f="${r.f}">${r.f}</span></td><td class="n">${esc(r.n)}</td></tr>`;});
 document.getElementById('tb').innerHTML=h||'<tr><td colspan="4" class="empty">No matches.</td></tr>';
 document.getElementById('count').textContent=rows.length+' of '+DATA.length;
}
document.getElementById('q').addEventListener('input',render);
render();
</script>
</body>
</html>
