<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innovations of the Past 20 Years</title>
<style>
:root{--ink:#1d1d1b;--muted:#6b6a65;--line:#e6e4de;--bg:#fbfaf7;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:1240px;margin:0 auto;padding:48px 24px 64px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:40px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.circ{display:inline-block;overflow:hidden;width:1.24em;height:1.24em;border:1px solid currentColor;border-radius:50%;font-size:.34em;line-height:1.02em;text-align:center;box-sizing:border-box;vertical-align:baseline;margin:0;font-weight:400;font-style:normal;letter-spacing:0}
.sub{color:var(--muted);margin:0 0 28px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.bar input{flex:1 1 220px;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{color:var(--muted);font-size:13px;margin-left:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:#f4f2ed;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:11px 14px;vertical-align:top;border-bottom:1px solid var(--line)}
tr.first td{border-top:2px solid #d8d5cc}
tr:first-child td{border-top:none}
td.y{font-weight:700;font-variant-numeric:tabular-nums;width:64px}
td.t{font-weight:600;width:30%}
td.n{color:#3b3a36}
td.fr,th.fr{display:none}
body.showfr td.fr,body.showfr th.fr{display:table-cell}
td.fr{color:#3b3a36;font-style:italic;border-left:1px dashed var(--line)}
body.showfr td.t{width:22%}
.toggle{font-weight:600}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag[data-f="AI"]{background:#dbe8fb;color:#1f4f99}
.tag[data-f="Computing"]{background:#d6f0ee;color:#16605a}
.tag[data-f="Biology"]{background:#dcf2dc;color:#2b6a2b}
.tag[data-f="Medicine"]{background:#f9dede;color:#9a2b2b}
.tag[data-f="Physics"]{background:#e7e1fb;color:#4d3a99}
.tag[data-f="Space"]{background:#f6dcef;color:#8a2a72}
.tag[data-f="Energy"]{background:#fbe5d6;color:#8f4a1a}
.tag[data-f="Finance"]{background:#f8ecc8;color:#7a5a0c}
.tag[data-f="Transportation"]{background:#e4e4e1;color:#4a4a46}
.tag[data-f="Human origins"]{background:#efeeea;color:#5c5a54}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media (max-width:700px){
 h1{font-size:30px}
 thead{display:none}
 table,tbody,tr,td{display:block;width:100%}
 td{border:none;padding:2px 14px}
 tr{padding:10px 0;border-bottom:1px solid var(--line)}
 td.y:empty{display:none}
 body.showfr td.fr{display:block;border:none}
 td.t{width:auto}
}
@media print{.bar{display:none} body{background:#fff} th{position:static}}
</style>
</head>
<body>
<main>
<h1><span class="circ" aria-hidden="true">y</span>Innovations of the Past 20 Years</h1>
<p class="sub">46 breakthroughs in science, technology, medicine and finance, 2006–2026.</p>
<div class="bar">
 <input id="q" type="search" placeholder="Search innovations or notes…" aria-label="Search">
 <button class="chip toggle" id="frbtn" aria-pressed="false">+ Français</button>
 <span id="chips"></span>
 <span class="count" id="count"></span>
</div>
<table>
 <thead><tr><th>Year</th><th>Innovation</th><th>Field</th><th>Note</th><th class="fr" lang="fr">Note (français)</th></tr></thead>
 <tbody id="tb"></tbody>
</table>
</main>
<script>
const DATA=[{"y": 2006, "t": "Induced pluripotent stem cells (iPSCs)", "f": "Biology", "n": "Yamanaka turned adult mouse cells back into stem cells with just four genes; human iPSCs followed in 2007. Nobel Prize 2012.", "fr": "Yamanaka a reprogrammé des cellules adultes de souris en cellules souches avec seulement quatre gènes ; les iPSC humaines ont suivi en 2007. Prix Nobel 2012."}, {"y": 2006, "t": "CUDA", "f": "Computing", "n": "Nvidia made GPUs programmable for general computing. It became the hardware foundation for training neural networks.", "fr": "Nvidia a rendu les GPU programmables pour le calcul général ; ils sont devenus le socle matériel de l'entraînement des réseaux de neurones."}, {"y": 2006, "t": "Hinton's deep-learning paper in Science", "f": "AI", "n": "Hinton and Salakhutdinov showed deep networks could be trained layer by layer, reviving neural-network research.", "fr": "Hinton et Salakhutdinov ont montré qu'on pouvait entraîner des réseaux profonds couche par couche, relançant la recherche sur les réseaux de neurones."}, {"y": 2006, "t": "Amazon Web Services (S3, EC2)", "f": "Computing", "n": "Rentable cloud storage and servers on demand; startups no longer needed their own data centers.", "fr": "Stockage et serveurs en nuage loués à la demande ; les start-up n'ont plus besoin de leurs propres centres de données."}, {"y": 2006, "t": "HPV vaccine (Gardasil)", "f": "Medicine", "n": "Prevents the virus behind most cervical cancers; vaccinated generations show steep drops in the disease.", "fr": "Protège contre le virus responsable de la plupart des cancers du col de l'utérus ; chez les générations vaccinées, la maladie recule fortement."}, {"y": 2007, "t": "iPhone", "f": "Computing", "n": "Touchscreen phone with a full web browser; defined the modern smartphone and mobile internet.", "fr": "Téléphone tactile doté d'un véritable navigateur web ; il a défini le smartphone moderne et l'internet mobile."}, {"y": 2008, "t": "Bitcoin and blockchain", "f": "Finance", "n": "Satoshi Nakamoto's white paper (Oct 2008) described money on a shared, tamper-proof ledger; the network went live Jan 2009.", "fr": "Le livre blanc de Satoshi Nakamoto (oct. 2008) décrit une monnaie fondée sur un registre partagé et infalsifiable ; le réseau démarre en janvier 2009."}, {"y": 2008, "t": "U.S. shale boom", "f": "Energy", "n": "Horizontal drilling plus hydraulic fracturing made the U.S. the world's largest oil and gas producer.", "fr": "Le forage horizontal et la fracturation hydraulique ont fait des États-Unis le premier producteur mondial de pétrole et de gaz."}, {"y": 2008, "t": "App Store and Android", "f": "Computing", "n": "Opened phones to third-party software and created the app economy.", "fr": "Ouverture des téléphones aux logiciels tiers et naissance de l'économie des applications."}, {"y": 2008, "t": "Denisovans", "f": "Human origins", "n": "A finger bone from Denisova Cave, Siberia; its DNA (2010) revealed an unknown archaic human group whose genes survive in living people.", "fr": "Un os de doigt trouvé dans la grotte de Denisova (Sibérie) ; son ADN (2010) a révélé un groupe humain archaïque inconnu, dont des gènes survivent chez l'homme actuel."}, {"y": 2009, "t": "Waymo (Google self-driving car project)", "f": "Transportation", "n": "Started inside Google; launched the first fully driverless public robotaxi service, in Phoenix, in 2020.", "fr": "Né au sein de Google ; a lancé à Phoenix, en 2020, le premier service public de robotaxis sans conducteur."}, {"y": 2010, "t": "DeepMind", "f": "AI", "n": "Founded in London by Hassabis, Legg and Suleyman; bought by Google in 2014. Later built AlphaGo and AlphaFold.", "fr": "Fondée à Londres par Hassabis, Legg et Suleyman ; rachetée par Google en 2014. A ensuite créé AlphaGo et AlphaFold."}, {"y": 2011, "t": "First checkpoint inhibitor (Yervoy)", "f": "Medicine", "n": "First drug to release the immune system's brakes against cancer (melanoma). Basis of the 2018 Nobel to Allison and Honjo.", "fr": "Premier médicament levant les freins du système immunitaire contre le cancer (mélanome). À l'origine du Nobel 2018 d'Allison et Honjo."}, {"y": 2012, "t": "CRISPR-Cas9 gene editing", "f": "Biology", "n": "Doudna and Charpentier showed Cas9 can be programmed to cut any chosen DNA sequence. Nobel Prize 2020.", "fr": "Doudna et Charpentier ont montré que Cas9 peut être programmée pour couper n'importe quelle séquence d'ADN choisie. Prix Nobel 2020."}, {"y": 2012, "t": "AlexNet", "f": "AI", "n": "A GPU-trained neural network won the ImageNet contest by a wide margin, starting the deep-learning era.", "fr": "Un réseau de neurones entraîné sur GPU remporte le concours ImageNet avec une large avance, ouvrant l'ère de l'apprentissage profond."}, {"y": 2012, "t": "Higgs boson discovered", "f": "Physics", "n": "Found at CERN's Large Hadron Collider, completing the Standard Model. Nobel 2013 to Higgs and Englert.", "fr": "Découvert au Grand collisionneur de hadrons du CERN, il complète le Modèle standard. Nobel 2013 pour Higgs et Englert."}, {"y": 2013, "t": "Sovaldi (sofosbuvir)", "f": "Medicine", "n": "Pill-based regimens built on it cure over 90% of hepatitis C infections.", "fr": "Les traitements oraux fondés sur cette molécule guérissent plus de 90 % des infections par l'hépatite C."}, {"y": 2014, "t": "Tether (USDT)", "f": "Finance", "n": "First major dollar-pegged stablecoin; became the most traded crypto asset.", "fr": "Premier grand stablecoin adossé au dollar ; devenu l'actif crypto le plus échangé."}, {"y": 2014, "t": "Keytruda", "f": "Medicine", "n": "PD-1 checkpoint inhibitor approved for melanoma, then many cancers; became the world's best-selling drug.", "fr": "Inhibiteur de point de contrôle PD-1 approuvé pour le mélanome, puis pour de nombreux cancers ; devenu le médicament le plus vendu au monde."}, {"y": 2015, "t": "Ethereum", "f": "Finance", "n": "Buterin's blockchain runs programmable smart contracts, the base for DeFi, NFTs and most stablecoins.", "fr": "La blockchain de Buterin exécute des contrats intelligents programmables, base de la DeFi, des NFT et de la plupart des stablecoins."}, {"y": 2015, "t": "Reusable orbital rocket (Falcon 9 landing)", "f": "Space", "n": "First booster landing after an orbital launch (Dec 2015); reuse sharply cut the cost of reaching orbit.", "fr": "Premier atterrissage d'un premier étage après un lancement orbital (déc. 2015) ; la réutilisation a fortement réduit le coût d'accès à l'orbite."}, {"y": 2015, "t": "Gravitational waves detected", "f": "Physics", "n": "LIGO caught two black holes merging (announced 2016), confirming Einstein's prediction. Nobel 2017.", "fr": "LIGO a capté la fusion de deux trous noirs (annoncée en 2016), confirmant la prédiction d'Einstein. Nobel 2017."}, {"y": 2016, "t": "AlphaGo beats Lee Sedol", "f": "AI", "n": "DeepMind's system won 4–1 at Go, a game long thought decades away for computers.", "fr": "Le système de DeepMind gagne 4–1 au go, un jeu que l'on croyait hors de portée des ordinateurs pour des décennies."}, {"y": 2017, "t": "Transformer (\"Attention Is All You Need\")", "f": "AI", "n": "Google paper introducing the architecture behind GPT, Claude, Gemini and nearly all modern AI models.", "fr": "Article de Google présentant l'architecture sur laquelle reposent GPT, Claude, Gemini et presque tous les modèles d'IA modernes."}, {"y": 2017, "t": "Ozempic (semaglutide)", "f": "Medicine", "n": "Approved for type 2 diabetes; as Wegovy (2021) for obesity. Launched the GLP-1 weight-loss era.", "fr": "Approuvé pour le diabète de type 2, puis sous le nom de Wegovy (2021) pour l'obésité. Il a ouvert l'ère des GLP-1 contre le surpoids."}, {"y": 2017, "t": "First CAR-T therapy (Kymriah)", "f": "Medicine", "n": "Patients' own T cells are engineered to hunt leukemia; a living drug, often curative where nothing else worked.", "fr": "Les lymphocytes T du patient sont modifiés pour traquer la leucémie ; un « médicament vivant », souvent curatif quand rien d'autre n'a fonctionné."}, {"y": 2017, "t": "Luxturna", "f": "Medicine", "n": "First U.S.-approved gene therapy for an inherited disease (a form of retinal blindness).", "fr": "Première thérapie génique approuvée aux États-Unis pour une maladie héréditaire (une forme de cécité rétinienne)."}, {"y": 2017, "t": "Tesla Model 3", "f": "Transportation", "n": "First mass-market long-range electric car; made EVs mainstream.", "fr": "Première voiture électrique grand public à longue autonomie ; elle a banalisé les véhicules électriques."}, {"y": 2017, "t": "Binance", "f": "Finance", "n": "Founded by Changpeng Zhao; within months the largest crypto exchange by volume.", "fr": "Fondée par Changpeng Zhao ; en quelques mois, la plus grande plateforme d'échange de cryptomonnaies en volume."}, {"y": 2018, "t": "AlphaFold", "f": "AI", "n": "Won the CASP13 protein-structure contest; AlphaFold 2 (2020) predicts structures near lab accuracy. Nobel Chemistry 2024.", "fr": "Vainqueur du concours CASP13 de prédiction des structures protéiques ; AlphaFold 2 (2020) atteint une précision proche de celle du laboratoire. Nobel de chimie 2024."}, {"y": 2019, "t": "First image of a black hole", "f": "Space", "n": "The Event Horizon Telescope linked radio dishes worldwide to image the black hole in galaxy M87.", "fr": "L'Event Horizon Telescope a relié des radiotélescopes du monde entier pour photographier le trou noir de la galaxie M87."}, {"y": 2020, "t": "mRNA COVID-19 vaccines", "f": "Medicine", "n": "Pfizer-BioNTech and Moderna vaccines authorized within a year of the virus's sequence. Nobel 2023 to Karikó and Weissman.", "fr": "Vaccins de Pfizer-BioNTech et de Moderna autorisés moins d'un an après le séquençage du virus. Nobel 2023 pour Karikó et Weissman."}, {"y": 2021, "t": "James Webb Space Telescope", "f": "Space", "n": "Launched Dec 25, 2021; infrared views of the earliest galaxies and of exoplanet atmospheres.", "fr": "Lancé le 25 décembre 2021 ; images infrarouges des toutes premières galaxies et des atmosphères d'exoplanètes."}, {"y": 2022, "t": "ChatGPT", "f": "AI", "n": "OpenAI's chatbot launched Nov 30, 2022 and reached about 100 million users in two months, the fastest-growing app to then.", "fr": "Le chatbot d'OpenAI, lancé le 30 novembre 2022, a atteint environ 100 millions d'utilisateurs en deux mois, la croissance la plus rapide jamais vue jusque-là."}, {"y": 2022, "t": "Nobel for ancient human DNA (Pääbo)", "f": "Human origins", "n": "Svante Pääbo honored for sequencing the Neanderthal genome and discovering the Denisovans.", "fr": "Svante Pääbo récompensé pour le séquençage du génome de Néandertal et la découverte des Dénisoviens."}, {"y": 2022, "t": "Fusion ignition (NIF)", "f": "Energy", "n": "Lawrence Livermore's lasers produced more fusion energy (3.15 MJ) than they delivered to the fuel (2.05 MJ), Dec 5, 2022.", "fr": "Les lasers du Lawrence Livermore ont produit plus d'énergie de fusion (3,15 MJ) qu'ils n'en ont fourni au combustible (2,05 MJ), le 5 décembre 2022."}, {"y": 2023, "t": "Casgevy, first CRISPR therapy", "f": "Medicine", "n": "Approved in the UK (Nov) and U.S. (Dec) for sickle-cell disease and beta thalassemia.", "fr": "Approuvé au Royaume-Uni (nov.) et aux États-Unis (déc.) contre la drépanocytose et la bêta-thalassémie."}, {"y": 2024, "t": "Neuralink first human implant", "f": "Medicine", "n": "A paralyzed patient controlled a computer cursor by thought alone.", "fr": "Un patient paralysé a contrôlé un curseur d'ordinateur par la seule pensée."}, {"y": 2024, "t": "Nobel Prizes for AI", "f": "AI", "n": "Physics to Hopfield and Hinton for neural networks; Chemistry to Hassabis and Jumper (AlphaFold) with Baker (protein design).", "fr": "Physique pour Hopfield et Hinton (réseaux de neurones) ; chimie pour Hassabis et Jumper (AlphaFold), avec Baker (conception de protéines)."}, {"y": 2024, "t": "Reasoning models (OpenAI o1)", "f": "AI", "n": "Models trained to think step by step before answering; large gains in math, science and coding.", "fr": "Modèles entraînés à raisonner étape par étape avant de répondre ; nets progrès en mathématiques, en sciences et en programmation."}, {"y": 2025, "t": "DeepSeek-R1", "f": "AI", "n": "Chinese open-weight reasoning model rivaling top U.S. models at a reported fraction of the cost; Nvidia lost nearly $600B in value in one day.", "fr": "Modèle de raisonnement chinois à poids ouverts, rivalisant avec les meilleurs modèles américains pour une fraction du coût annoncé ; Nvidia a perdu près de 600 milliards de dollars de valeur en un jour."}, {"y": 2025, "t": "Starship", "f": "Space", "n": "Fully reusable super-heavy rocket. First flight Apr 2023, booster caught by the tower Oct 2024, test campaign through 2025.", "fr": "Fusée super-lourde entièrement réutilisable. Premier vol en avril 2023, propulseur rattrapé par la tour en octobre 2024, campagne d'essais tout au long de 2025."}, {"y": 2025, "t": "First personalized CRISPR therapy", "f": "Medicine", "n": "A custom base-editing treatment built in about six months for infant KJ Muldoon, born with a rare liver disorder (CHOP/Penn).", "fr": "Un traitement d'édition de bases sur mesure, conçu en six mois environ pour le nourrisson KJ Muldoon, atteint d'une maladie hépatique rare (CHOP/Penn)."}, {"y": 2025, "t": "Lenacapavir (Yeztugo)", "f": "Medicine", "n": "FDA-approved twice-yearly injection that prevents HIV infection.", "fr": "Injection semestrielle approuvée par la FDA qui prévient l'infection par le VIH."}, {"y": 2026, "t": "Proof of the Riemann hypothesis", "f": "AI", "n": "Levent Alpöge and Claude produced a machine-checked (Lean) proof of RH and GRH; verified Nov 21.", "fr": "Levent Alpöge et Claude ont produit une preuve vérifiée par machine (Lean) de l'hypothèse de Riemann et de sa forme généralisée ; vérifiée le 21 nov."}, {"y": 2026, "t": "Trump accounts", "f": "Finance", "n": "Children's investment accounts launched July 4, with $1,000 from Treasury for babies born 2025–2028. Musk pledged ~$10B in SpaceX stock.", "fr": "Comptes d'investissement pour enfants lancés le 4 juillet, avec 1 000 $ du Trésor pour les bébés nés entre 2025 et 2028. Musk a promis environ 10 milliards de dollars en actions SpaceX."}];
const FIELDS=["AI", "Computing", "Biology", "Medicine", "Physics", "Space", "Energy", "Finance", "Transportation", "Human origins"];
let active=new Set();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chips=document.getElementById('chips');
FIELDS.forEach(f=>{const b=document.createElement('button');b.className='chip';b.textContent=f;
 b.onclick=()=>{active.has(f)?active.delete(f):active.add(f);b.classList.toggle('on');render();};chips.appendChild(b);});
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const rows=DATA.filter(r=>(!active.size||active.has(r.f))&&(!q||(r.t+' '+r.n+' '+r.fr+' '+r.f+' '+r.y).toLowerCase().includes(q)));
 let prev=null,h='';
 rows.forEach(r=>{const first=r.y!==prev;prev=r.y;
  h+=`<tr class="${first?'first':''}"><td class="y">${first?r.y:''}</td><td class="t">${esc(r.t)}</td><td><span class="tag" data-f="${r.f}">${r.f}</span></td><td class="n">${esc(r.n)}</td><td class="fr" lang="fr">${esc(r.fr)}</td></tr>`;});
 document.getElementById('tb').innerHTML=h||'<tr><td colspan="5" class="empty">No matches.</td></tr>';
 document.getElementById('count').textContent=rows.length+' of '+DATA.length;
}
document.getElementById('q').addEventListener('input',render);
const fb=document.getElementById('frbtn');
fb.onclick=()=>{const on=document.body.classList.toggle('showfr');fb.classList.toggle('on',on);fb.setAttribute('aria-pressed',on);fb.textContent=(on?'− ':'+ ')+'Français';};
render();
</script>
</body>
</html>
